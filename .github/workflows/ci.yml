name: CI & Auto Release

on:
  push:
    branches: ["master"]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force build & release the desktop even if the version already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ==========================================
  # Build & Auto Release Desktop App
  # Runs automatically when tauri version changed inside tauri.conf.json
  # ==========================================
  release-desktop:
    name: Build & Release Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Tauri Version Changes
        id: version_check
        shell: bash
        run: |
          VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          echo "Target Desktop Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          TAG_EXISTS=false
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
            TAG_EXISTS=true
          fi

          FORCE="${{ inputs.force_release }}"

          if [ "$TAG_EXISTS" = "false" ] || [ "$FORCE" = "true" ]; then
            echo "Tag v$VERSION belum ada di GitHub (atau force_release aktif). Memulai build release..."
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION sudah ada di GitHub Release. Melewati proses build desktop untuk menghemat waktu."
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun Environment
        if: steps.version_check.outputs.should_release == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        if: steps.version_check.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo & Rust
        if: steps.version_check.outputs.should_release == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri"

      - name: Install Frontend Dependencies
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: ./frontend
        run: bun install

      - name: Build & Sign Desktop App
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: ./frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri:build:signed

      - name: Publish GitHub Release (Tag & Assets)
        if: steps.version_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version_check.outputs.version }}
          name: Satgas Gakkum Minops v${{ steps.version_check.outputs.version }}
          body: |
            ### Pembaruan Satgas Gakkum Minops LAPHAR v${{ steps.version_check.outputs.version }}
            Operasi Damai Cartenz 2026. Rilis otomatis oleh GitHub Actions CI/CD.

            #### Berkas Instalasi:
            * Unduh installer Windows (`-setup.exe`) di bawah ini.
            * Pengguna aplikasi versi sebelumnya akan menerima notifikasi update otomatis.
          draft: false
          prerelease: false
          files: |
            frontend/src-tauri/target/release/bundle/nsis/Satgas.Gakkum.Minops_${{ steps.version_check.outputs.version }}_x64-setup.exe
            frontend/src-tauri/target/release/bundle/nsis/Satgas.Gakkum.Minops_${{ steps.version_check.outputs.version }}_x64-setup.exe.sig
            frontend/src-tauri/target/release/bundle/nsis/latest.json